name: DevSecOps Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: devsecops-demo-app
  NODE_VERSION: '20'

jobs:

  # ─────────────────────────────────────────────
  # STAGE 1: SAST - Static Application Security Testing
  # Scans your source code for security vulnerabilities
  # before anything is built or deployed
  # ─────────────────────────────────────────────
  sast:
    name: SAST - Code Scanning
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Semgrep SAST scan
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/nodejs
          p/secrets
          p/owasp-top-ten
      env:
        SEMGREP_APP_TOKEN: `${{ secrets.SEMGREP_APP_TOKEN }}
      continue-on-error: true

    - name: Upload SAST results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: sast-results
        path: semgrep.sarif
        if-no-files-found: ignore

  # ─────────────────────────────────────────────
  # STAGE 2: Dependency Scanning
  # Checks npm packages for known vulnerabilities
  # ─────────────────────────────────────────────
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: `${{ env.NODE_VERSION }}

    - name: Install dependencies
      working-directory: app
      run: npm ci

    - name: Run npm audit
      working-directory: app
      run: |
        npm audit --audit-level=high --json > ../reports/npm-audit.json || true
        npm audit --audit-level=critical
      continue-on-error: false

    - name: Upload dependency scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-scan-results
        path: reports/npm-audit.json
        if-no-files-found: ignore

  # ─────────────────────────────────────────────
  # STAGE 3: IaC Scanning
  # Scans Terraform for security misconfigurations
  # before infrastructure is ever provisioned
  # ─────────────────────────────────────────────
  iac-scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Checkov IaC scan
      uses: bridgecrewio/checkov-action@master
      with:
        directory: terraform
        framework: terraform
        soft_fail: true
        output_format: sarif
        output_file_path: reports/checkov-results.sarif

    - name: Upload IaC scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: iac-scan-results
        path: reports/checkov-results.sarif
        if-no-files-found: ignore

  # ─────────────────────────────────────────────
  # STAGE 4: Build Docker Image
  # Only runs if stages 1-3 passed
  # ─────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [dependency-scan, iac-scan]

    outputs:
      image-tag: `${{ steps.meta.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Generate image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: `${{ env.IMAGE_NAME }}
        tags: |
          type=sha,prefix=sha-
          type=ref,event=branch

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile
        push: false
        tags: `${{ steps.meta.outputs.tags }}
        labels: `${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        outputs: type=docker,dest=/tmp/image.tar

    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: /tmp/image.tar

  # ─────────────────────────────────────────────
  # STAGE 5: Container Image Scanning
  # Scans the built image for OS-level CVEs
  # and vulnerable packages
  # ─────────────────────────────────────────────
  image-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    needs: [build]

    steps:
    - name: Download image artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image
        path: /tmp

    - name: Load Docker image
      run: docker load --input /tmp/image.tar

    - name: Run Trivy image scan
      uses: aquasecurity/trivy-action@master
      with:
        input: /tmp/image.tar
        format: sarif
        output: trivy-results.sarif
        severity: CRITICAL,HIGH
        exit-code: '0'

    - name: Run Trivy - fail on CRITICAL CVEs
      uses: aquasecurity/trivy-action@master
      with:
        input: /tmp/image.tar
        format: table
        severity: CRITICAL
        exit-code: '1'
      continue-on-error: true

    - name: Upload Trivy scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: trivy-results
        path: trivy-results.sarif

  # ─────────────────────────────────────────────
  # STAGE 6: Security Summary Report
  # Consolidates all findings into one report
  # ─────────────────────────────────────────────
  security-report:
    name: Security Summary Report
    runs-on: ubuntu-latest
    needs: [sast, dependency-scan, iac-scan, image-scan]
    if: always()

    steps:
    - name: Download all scan artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-reports

    - name: Generate security summary
      run: |
        echo "# Security Scan Summary" >> `$GITHUB_STEP_SUMMARY
        echo "" >> `$GITHUB_STEP_SUMMARY
        echo "| Stage | Status |" >> `$GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> `$GITHUB_STEP_SUMMARY
        echo "| SAST (Semgrep) | `${{ needs.sast.result }} |" >> `$GITHUB_STEP_SUMMARY
        echo "| Dependency Scan (npm audit) | `${{ needs.dependency-scan.result }} |" >> `$GITHUB_STEP_SUMMARY
        echo "| IaC Scan (Checkov) | `${{ needs.iac-scan.result }} |" >> `$GITHUB_STEP_SUMMARY
        echo "| Image Scan (Trivy) | `${{ needs.image-scan.result }} |" >> `$GITHUB_STEP_SUMMARY
        echo "" >> `$GITHUB_STEP_SUMMARY
        echo "Commit: `${{ github.sha }}" >> `$GITHUB_STEP_SUMMARY
        echo "Branch: `${{ github.ref_name }}" >> `$GITHUB_STEP_SUMMARY
        echo "Triggered by: `${{ github.actor }}" >> `$GITHUB_STEP_SUMMARY

    - name: Upload consolidated report
      uses: actions/upload-artifact@v4
      with:
        name: security-summary
        path: all-reports/

  # ─────────────────────────────────────────────
  # STAGE 7: Deploy (only if all security stages pass)
  # In a real pipeline this pushes to ECR and
  # updates a Kubernetes deployment
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy (Simulated)
    runs-on: ubuntu-latest
    needs: [image-scan, security-report]
    if: github.ref == 'refs/heads/main' && needs.image-scan.result == 'success'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Simulate deployment gate
      run: |
        echo "All security gates passed."
        echo "In a real pipeline this step would:"
        echo "  1. Push image to AWS ECR"
        echo "  2. Update image tag in GitOps repo"
        echo "  3. ArgoCD picks up the change and deploys"
        echo ""
        echo "Image tag: `${{ needs.build.outputs.image-tag }}"
        echo "Deploying to: production"
        echo "Status: SUCCESS"
